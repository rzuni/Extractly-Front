<div class="content-entry-yt-list">
  <div *ngFor="let item of itemList" class="entry-card">
    <div class="entry-header">
      <h3>{{ item.title || 'Entrada sin título' }}</h3>
    </div>

    <div class="entry-content">
      <p>Tipo: {{ item.type }}</p>
      <p>Fuente: {{ item.source }}</p>

      <!-- Mostrar video si tiene fileUrl -->
      <video *ngIf="item.fileUrl" width="320" height="240" controls>
        <source [src]="item.fileUrl" type="video/mp4" />
        Tu navegador no soporta video HTML5.
      </video>
    </div>

    <!-- Botones de acción -->
    <div *ngIf="areActionsAvailable" class="entry-actions">
      <!-- Mostrar solo eliminar si es video -->
      <button *ngIf="item.fileUrl" (click)="deleteEntry(item)">
        🗑️ Eliminar
      </button>
    </div>
  </div>
</div>
