<div class="content-entry-yt-list">
  <div *ngFor="let item of itemList" class="entry-card">
    <div class="entry-header">
      <h3>{{ item.title || 'Entrada sin título' }}</h3>
      <span>{{ item.language?.toUpperCase() }}</span>
    </div>

    <div class="entry-content">
      <p>Tipo: {{ item.type }}</p>
      <p>Fuente: {{ item.source }}</p>
    </div>

    <div *ngIf="areActionsAvailable" class="entry-actions">
      <button (click)="showDetailModal(item, modal)">Editar</button>
      <button (click)="deleteEntry(item)">Eliminar</button>
    </div>
  </div>

  <app-modal #modal>
    <app-content-entry-yt-form
      [formData]="selectedItem"
      (onSubmit)="onFormEventCalled($event)">
    </app-content-entry-yt-form>
  </app-modal>
</div>
