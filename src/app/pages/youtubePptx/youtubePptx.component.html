<section class="pptx-uploader-page">
  <div class="hero">
    <h1>Bienvenido al Generador de <strong>Presentaciones PPTX</strong></h1>
    <p>Introduce la URL de un video de YouTube y obtén un resumen en formato de presentación.</p>
  </div>

  <div class="pptx-uploader-container">
    <h2>Generar Presentación PPTX de Resumen con Gemini</h2>

    <div class="form-group">
      <label for="youtubeUrl">URL de YouTube:</label>
      <input type="text" id="youtubeUrl" class="text" [(ngModel)]="youtubeUrl" placeholder="Ej: https://www.youtube.com/watch?v=..." />
    </div>

    <button class="submit" (click)="generatePptxFromYoutubeUrl()" [disabled]="!youtubeUrl || isLoading">
      {{ isLoading ? 'Generando PPTX...' : 'Generar PPTX desde URL' }}
    </button>

    <div *ngIf="message" [class]="isError ? 'error-message' : 'success-message'">
      {{ message }}
    </div>

    <a *ngIf="downloadUrl" [href]="downloadUrl" [download]="downloadFileName">
      Descargar Resumen PPTX
    </a>
  </div>
</section>
