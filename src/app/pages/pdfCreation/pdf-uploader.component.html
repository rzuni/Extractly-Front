<div class="pdf-uploader-container">
  <h2>Generar Resumen de PDF con Gemini</h2>

  <input type="file" (change)="onFileSelected($event)" accept="application/pdf">

  <div class="form-group">
    <label for="customPrompt">Prompt Personalizado (Opcional):</label>
    <textarea id="customPrompt" [(ngModel)]="customPrompt" rows="3" placeholder="Ej: 'Genera un resumen breve y conciso sobre...'"></textarea>
  </div>

  <button (click)="uploadPdf()" [disabled]="!selectedFile || isLoading">
    {{ isLoading ? 'Generando PDF...' : 'Subir PDF y Generar Resumen' }}
  </button>

  <div *ngIf="message" [class]="isError ? 'error-message' : 'success-message'">
    {{ message }}
  </div>

  <a *ngIf="downloadUrl" [href]="downloadUrl" download="resumen_gemini.pdf">Descargar Resumen PDF</a>
</div>
