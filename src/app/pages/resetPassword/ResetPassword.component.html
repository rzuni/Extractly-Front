<div class="full-screen-container">
  <div class="reset-password-card">
    <h2>Restablece tu Contraseña</h2>
    <p>Ingresa tu nueva contraseña.</p>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nueva Contraseña</mat-label>
        <input matInput formControlName="newPassword" type="password" />
        <mat-error *ngIf="resetPasswordForm.get('newPassword')?.hasError('minlength') && resetPasswordForm.get('newPassword')?.touched">
          La contraseña debe tener al menos 8 caracteres.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirmar Contraseña</mat-label>
        <input matInput formControlName="confirmPassword" type="password" />
        <mat-error *ngIf="resetPasswordForm.get('confirmPassword')?.hasError('required') && resetPasswordForm.get('confirmPassword')?.touched">
          La confirmación de contraseña es obligatoria.
        </mat-error>
        <mat-error *ngIf="resetPasswordForm.hasError('mismatch') && resetPasswordForm.get('confirmPassword')?.touched">
          Las contraseñas no coinciden.
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="resetPasswordForm.invalid" class="full-width">
        Restablecer Contraseña
      </button>
    </form>
  </div>
</div>
