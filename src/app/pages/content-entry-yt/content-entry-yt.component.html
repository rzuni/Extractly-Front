<section class="content-entry-yt-page">
  <div class="hero">
    <h1>Bienvenido al Módulo de <strong>Entrada de Contenido</strong></h1>
    <p>Ingresa archivo o enlace de YouTube para generar un resumen PDF.</p>
  </div>

  <div class="content-entry-yt-form">
    <h2>Sube tu Contenido</h2>
    <p>Selecciona un archivo de video mp4 o pega un enlace de YouTube.</p>

    <div class="form-grid">
      <div class="form-group">
        <label>Enlace de YouTube</label>
        <input class="url" type="text" placeholder="Pega tu enlace aquí..." [(ngModel)]="youtubeUrl" />
        <small>Ejemplo: https://www.youtube.com/watch?v=abc123</small>
      </div>
    </div>

    <div class="action-buttons">
      <button class="clear" (click)="clearFields()">Limpiar Campos</button>
      <button (click)="submit()" [disabled]="isLoading || (!selectedFile && !youtubeUrl)">
        {{ isLoading ? 'Procesando...' : 'Generar Resumen' }}
      </button>
    </div>

    <div *ngIf="message" [class]="isError ? 'error-message' : 'success-message'">
      {{ message }}
    </div>

    <a *ngIf="downloadUrl" [href]="downloadUrl" download="resumen_youtube.pdf" class="btn btn-success mt-2">
      Descargar PDF
    </a>
  </div>
</section>
