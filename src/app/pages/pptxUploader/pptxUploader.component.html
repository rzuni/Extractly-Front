<div class="pptx-uploader-container">
  <h2>Generar Presentación PPTX de Resumen con Gemini</h2>

  <input type="file" (change)="onFileSelected($event)" accept="application/pdf">

  <div class="form-group">
    <label for="customPrompt">Prompt Personalizado (Opcional):</label>
    <textarea id="customPrompt" [(ngModel)]="customPrompt" rows="3" placeholder="Ej: 'Genera un resumen breve y conciso sobre...'"></textarea>
  </div>

  <button (click)="uploadPdfAndGeneratePptx()" [disabled]="!selectedFile || isLoading">
    {{ isLoading ? 'Generando PPTX...' : 'Subir PDF y Generar PPTX' }}
  </button>

  <div *ngIf="message" [class]="isError ? 'error-message' : 'success-message'">
    {{ message }}
  </div>

  <a *ngIf="downloadUrl" [href]="downloadUrl" download="resumen_gemini.pptx">Descargar Resumen PPTX</a>
</div>
